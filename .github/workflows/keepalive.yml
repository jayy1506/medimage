name: Render Free Tier Keep-Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render 15-minute idle spindown
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          URL="${{ secrets.RENDER_HEALTH_URL || 'https://gyaanlab-platform.onrender.com/health' }}"
          echo "Sending keep-alive ping to $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "FAILED")
          echo "Received HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Render service is awake and healthy."
          else
            echo "Ping completed with status $STATUS (or woke up sleeping container)."
          fi
